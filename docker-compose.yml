version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: dv_mongo
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=
      - MONGO_INITDB_ROOT_PASSWORD=
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dv_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/digitalvoting
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:5001
    container_name: dv_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:5001
    depends_on:
      - backend

  test-emitter:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dv_test_emitter
    command: ["node", "test-emitter.js"]
    ports:
      - "5002:5002"
    depends_on:
      - backend
