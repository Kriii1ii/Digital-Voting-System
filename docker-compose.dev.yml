version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dv_backend_dev
    command: sh -c "npm install --silent && npx nodemon --watch . --ext js --exec node server.js"
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/digitalvoting
    volumes:
      - ./backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    depends_on:
      - mongo

  frontend:
    image: node:18-alpine
    container_name: dv_frontend_dev
    working_dir: /usr/src/app
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_BACKEND_URL=http://host.docker.internal:5002
    volumes:
      - ./frontend:/usr/src/app:cached
      - /usr/src/app/node_modules
    depends_on:
      - backend
